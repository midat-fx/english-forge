[package]
name = "english-forge"
version = "0.7.1"
description = "A local-first active English practice workbench"
authors = ["English Forge"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "english_forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# openat/renameat/unlinkat and O_NOFOLLOW hardening are used only on Unix.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
